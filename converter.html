<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Currency Pro</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #3792ff; 
            --text: #e0e0e0;
            --input-bg: #2d2d2d;
        }


        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; margin-bottom: 24px; font-weight: 600; }

        .currency-list { display: flex; flex-direction: column; gap: 15px; }

        .currency-card {
            background: #f1f3f5;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .info { flex-grow: 1; }
        .info label { display: block; font-size: 0.8rem; color: #666; font-weight: bold; }
        .info input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.4rem;
            font-weight: 500;
            outline: none;
            padding: 4px 0;
        }

        .remove-btn {
            color: #ff4d4d;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        select {
            flex-grow: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button.add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status { font-size: 0.7rem; color: #999; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Currency Converter</h2>
    
    <div id="currency-list" class="currency-list">
        <div class="currency-card" data-code="EUR">
            <div class="info">
                <label>EUR</label>
                <input type="number" value="1" step="any" oninput="convert(this, 'EUR')">
            </div>
        </div>
        <div class="currency-card" data-code="PLN">
            <div class="info">
                <label>PLN</label>
                <input type="number" step="any" oninput="convert(this, 'PLN')">
            </div>
        </div>
    </div>

    <div class="controls">
        <select id="new-currency-select">
            <option value="USD">USD - US Dollar</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="CHF">CHF - Swiss Franc</option>
            <option value="CAD">CAD - Canadian Dollar</option>
        </select>
        <button class="add-btn" onclick="addCurrency()">Add</button>
    </div>

    <p class="status" id="last-update">Fetching latest rates...</p>
</div>

<script>
    let rates = {};
    const listContainer = document.getElementById('currency-list');

    // 1. Fetch live rates from a free API
    async function fetchRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/EUR');
            const data = await response.json();
            rates = data.rates;
            document.getElementById('last-update').innerText = "Last updated: " + new Date().toLocaleTimeString();
            // Initial conversion
            convert(document.querySelector('[data-code="EUR"] input'), 'EUR');
        } catch (error) {
            document.getElementById('last-update').innerText = "Error loading rates.";
        }
    }

    // 2. Core Conversion Logic
    function convert(inputElement, baseCode) {
        const val = parseFloat(inputElement.value);
        if (isNaN(val)) return;

        // Convert input value to EUR base first
        const valueInEUR = val / rates[baseCode];

        // Update all other inputs
        const allInputs = document.querySelectorAll('.currency-card input');
        allInputs.forEach(input => {
            if (input !== inputElement) {
                const code = input.closest('.currency-card').dataset.code;
                const result = valueInEUR * rates[code];
                input.value = result.toFixed(2);
            }
        });
    }

    // 3. Add dynamic currency
    function addCurrency() {
        const select = document.getElementById('new-currency-select');
        const code = select.value;

        // Prevent duplicates
        if (document.querySelector(`[data-code="${code}"]`)) return;

        const card = document.createElement('div');
        card.className = 'currency-card';
        card.dataset.code = code;
        card.innerHTML = `
            <div class="info">
                <label>${code}</label>
                <input type="number" step="any" oninput="convert(this, '${code}')">
            </div>
            <div class="remove-btn" onclick="this.parentElement.remove()">✕</div>
        `;
        listContainer.appendChild(card);
        
        // Trigger a conversion to fill the new input
        const firstInput = document.querySelector('.currency-card input');
        convert(firstInput, firstInput.closest('.currency-card').dataset.code);
    }

    // Initialize
    fetchRates();
</script>

</body>
</html>
