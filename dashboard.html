<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My HTML Applications Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f6f8fa;
    }
    h1 {
      text-align: center;
    }
    .apps {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-top: 40px;
    }
    .icon-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
      padding: 30px 20px;
      width: 140px;
      transition: box-shadow 0.2s;
    }
    .icon-card:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.14);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }
    .app-name {
      color: #24292f;
      font-size: 1.05em;
    }
    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>📂 My HTML Applications</h1>
  <div class="apps">
    <a href="https://simonelimonta.github.io/single-file-html/tabata.html" target="_blank">
      <div class="icon-card">
        <span class="icon">🕒</span>
        <div class="app-name">tabata.html</div>
      </div>
    </a>
    <a href="https://simonelimonta.github.io/single-file-html/mylist.html" target="_blank">
      <div class="icon-card">
        <span class="icon">📝</span>
        <div class="app-name">mylist.html</div>
      </div>
    </a>
  </div>
</body>
</html>
