<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>My Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #29b6f6;
            --tap-highlight: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 30px;
            padding-top: 10px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid Layout */
        #app-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for mobile */
            gap: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* App Card Styling */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .app-card:active {
            transform: scale(0.98);
            background-color: var(--tap-highlight);
        }

        .icon-container {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .app-info {
            flex-grow: 1;
        }

        .app-name {
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .app-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .arrow {
            opacity: 0.3;
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* Add Item Button (Optional for future UI expansion) */
        .add-placeholder {
            border: 2px dashed rgba(255,255,255,0.1);
            background: transparent;
            justify-content: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <h1>LimoLab</h1>
        <p class="subtitle">Select an application</p>
    </header>

    <div id="app-grid">
        </div>

    <footer>
        <p>Personal Web Tools</p>
    </footer>

    <script>
        // CONFIGURATION: Add new apps here
        const appList = [
            {
                name: "Tabata Timer",
                description: "HIIT Interval Timer",
                url: "https://simonelimonta.github.io/single-file-html/tabata.html",
                icon: "⏱️",
                color: "rgba(255, 82, 82, 0.2)" // Red tint
            },
            {
                name: "Habit Tracker",
                description: "Daily progress log",
                url: "https://simonelimonta.github.io/single-file-html/tracker.html",
                icon: "📊",
                color: "rgba(68, 138, 255, 0.2)" // Blue tint
            },
            {
                name: "Todo List",
                description: "Tasks and reminders",
                url: "https://simonelimonta.github.io/single-file-html/mylist.html",
                icon: "✅",
                color: "rgba(105, 240, 174, 0.2)" // Green tint
            },
            {
                name: "Recorder",
                description: "When was the last time",
                url: "https://simonelimonta.github.io/single-file-html/lastime.html",
                icon: "📅",
                color: "rgba(200, 200, 200, 0.2)" // grey tint
            },
            {
                name: "Converter",
                description: "PLN <-> EUR",
                url: "https://simonelimonta.github.io/single-file-html/converter.html",
                icon: "🪙",
                color: "rgba(255, 240, 105, 0.2)" // Yellow tint
            }
            // To add a new app, copy a block above, paste it here, and change details.
        ];

        const grid = document.getElementById('app-grid');

        function renderApps() {
            grid.innerHTML = ''; // Clear current content

            appList.forEach(app => {
                // Create anchor element
                const card = document.createElement('a');
                card.href = app.url;
                card.className = 'app-card';
                
                // HTML Structure for the card
                card.innerHTML = `
                    <div class="icon-container" style="background-color: ${app.color}">
                        ${app.icon}
                    </div>
                    <div class="app-info">
                        <span class="app-name">${app.name}</span>
                        <span class="app-desc">${app.description}</span>
                    </div>
                    <div class="arrow">›</div>
                `;

                grid.appendChild(card);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderApps);

    </script>
</body>
</html>
